server:
  port: 8080

spring:
  application:
    name: quantumledger
  datasource:
    url: "jdbc:mysql://localhost:3306/quantumledger?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
    username: ${DB_USER:wallet_admin}
    password: ${DB_PASSWORD:admin_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: quantumledger
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
  reconciliation:
    enabled: true
    cron: "0 0 * * * *"             #every hour, on the hour
  transfer:
    min-amount-minor: 100           #Rs 1
    max-amount-minor: 100000        #Rs 1,00,000

logging:
  level:
    org.springframework.security: DEBUG